name: Tarea
description: Una tarea del backlog (P0/P1/P2)
title: "[P0] "
labels: ["task"]
body:
  - type: markdown
    attributes:
      value: |
        Antes de crear: revisá `docs/estado.md` (estado y decisiones) y definí el contrato de datos.
  - type: input
    id: objective
    attributes:
      label: Objetivo
      description: ¿Qué tiene que existir cuando esto esté listo?
      placeholder: "Ej: /api/health devuelve el estado del servicio"
    validations:
      required: true
  - type: dropdown
    id: priority
    attributes:
      label: Prioridad
      options:
        - P0 — imprescindible para el demo
        - P1 — diferenciador
        - P2 — bonus
    validations:
      required: true
  - type: textarea
    id: data_contract
    attributes:
      label: Contrato de datos
      description: Dataset, API/endpoint, campos, caché y fallback.
      placeholder: |
        Dataset: <misión / archivo NASA>
        API: <endpoint>
        Campos: <lista>
        Archivo: <ruta>
        Fallback: <caché / sample local>
        Qué puedo afirmar:
        Qué NO puedo afirmar:
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Criterios de aceptación
      description: Lista verificable.
      placeholder: |
        - [ ] ...
        - [ ] ...
        - [ ] ...
    validations:
      required: true
  - type: input
    id: owner
    attributes:
      label: Dueño
      placeholder: "Andy / David / Samuel / Jorge / Leo"
  - type: input
    id: estimate
    attributes:
      label: Estimación
      placeholder: "2 h"
  - type: input
    id: depends
    attributes:
      label: Depende de
      placeholder: "#12, #15"
